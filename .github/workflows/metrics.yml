name: Metrics

on:
  schedule:
    - cron: "0 18 * * *"
  workflow_dispatch:
  push:
    branches: ["main"]

jobs:
  github-metrics:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Generate languages metrics
        uses: lowlighter/metrics@latest
        with:
          token: ${{ secrets.METRICS_TOKEN }}
          user: lucagoc
          template: classic
          base: ""
          filename: github-metrics-languages.svg
          config_timezone: Europe/Paris
          
          # Include forks in stats
          repositories_forks: yes

          # Repositories to analyze
          repositories: |
            lucagoc/FlickDash
            lucagoc/pypixelcolor
            lucagoc/spaghetti
            lucagoc/yoga-14APU8-linux
            lucagoc/ibef-frontend
            lucagoc/coreos-config
            lucagoc/ATV-Kiosk-WebView
            lucagoc/bdt-poutre-emulator
            lucagoc/simple-esp8266-dht11-ha
            lucagoc/lpwan-collision-simulation-front
            lucagoc/PixelArcadeLauncher
            lucagoc/projet-zz1-2
            lucagoc/WakeCommander
            lucagoc/ocaSnake
            lucagoc/tetris-MP2I
            lucagoc/SoundVoltexIO
            lucagoc/study-rotary-phone

          # Languages plugin configuration
          plugin_languages: yes
          plugin_languages_analysis_timeout: 30
          plugin_languages_categories: programming
          plugin_languages_ignored: markdown
          plugin_languages_colors: github
          plugin_languages_limit: 10
          plugin_languages_recent_categories: programming
          plugin_languages_recent_days: 365
          plugin_languages_recent_load: 300
          plugin_languages_sections: most-used
          plugin_languages_threshold: 0%
          plugin_languages_other: yes
          plugin_languages_indepth: yes
